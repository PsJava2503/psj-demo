server:
  port: 8085

spring:
  application:
    name: commerce-payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_payment
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

payment:
  order-timeout-minutes: 30
  alipay:
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    app-id: 9021000165603108
    app-private-key: 
    alipay-public-key: 
    notify-url:
mybatis:
  type-handlers-package: com.commerce.mybatis
