server:
  port: 8082

spring:
  application:
    name: psj-commerce-inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/psj_commerce_inventory
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
