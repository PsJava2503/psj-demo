server:
  port: 8085

spring:
  application:
    name: psj-commerce-payment-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

dubbo:
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: 20881
  registry:
    address: nacos://localhost:8848
  scan:
    base-packages: com.psj.commerce.payment
