server:
  port: 8080

spring:
  application:
    name: commerce-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: commerce-order-service
          uri: lb://commerce-order-service
          predicates:
            - Path=/api/orders/**
        - id: commerce-user-service
          uri: lb://commerce-user-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/rbac/**
        - id: commerce-product-service
          uri: lb://commerce-product-service
          predicates:
            - Path=/api/products/**
        - id: commerce-payment-service
          uri: lb://commerce-payment-service
          predicates:
            - Path=/api/payments/**
        - id: commerce-inventory-service
          uri: lb://commerce-inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: commerce-notification-service
          uri: lb://commerce-notification-service
          predicates:
            - Path=/api/notifications/**
        - id: commerce-address-service
          uri: lb://commerce-address-service
          predicates:
            - Path=/api/addresses/**
        - id: commerce-cart-service
          uri: lb://commerce-cart-service
          predicates:
            - Path=/api/carts/**
        - id: commerce-agent-service
          uri: lb://commerce-agent-service
          predicates:
            - Path=/api/agents/**
        - id: commerce-order-service-openapi
          uri: lb://commerce-order-service
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - RewritePath=/v3/api-docs/order, /v3/api-docs
        - id: commerce-user-service-openapi
          uri: lb://commerce-user-service
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
        - id: commerce-product-service-openapi
          uri: lb://commerce-product-service
          predicates:
            - Path=/v3/api-docs/product
          filters:
            - RewritePath=/v3/api-docs/product, /v3/api-docs
        - id: commerce-payment-service-openapi
          uri: lb://commerce-payment-service
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - RewritePath=/v3/api-docs/payment, /v3/api-docs
        - id: commerce-inventory-service-openapi
          uri: lb://commerce-inventory-service
          predicates:
            - Path=/v3/api-docs/inventory
          filters:
            - RewritePath=/v3/api-docs/inventory, /v3/api-docs
        - id: commerce-notification-service-openapi
          uri: lb://commerce-notification-service
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - RewritePath=/v3/api-docs/notification, /v3/api-docs
        - id: commerce-address-service-openapi
          uri: lb://commerce-address-service
          predicates:
            - Path=/v3/api-docs/address
          filters:
            - RewritePath=/v3/api-docs/address, /v3/api-docs
        - id: commerce-cart-service-openapi
          uri: lb://commerce-cart-service
          predicates:
            - Path=/v3/api-docs/cart
          filters:
            - RewritePath=/v3/api-docs/cart, /v3/api-docs
        - id: commerce-agent-service-openapi
          uri: lb://commerce-agent-service
          predicates:
            - Path=/v3/api-docs/agent
          filters:
            - RewritePath=/v3/api-docs/agent, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Gateway
        url: /v3/api-docs
      - name: Order
        url: /v3/api-docs/order
      - name: User
        url: /v3/api-docs/user
      - name: Product
        url: /v3/api-docs/product
      - name: Payment
        url: /v3/api-docs/payment
      - name: Inventory
        url: /v3/api-docs/inventory
      - name: Notification
        url: /v3/api-docs/notification
      - name: Address
        url: /v3/api-docs/address
      - name: Cart
        url: /v3/api-docs/cart
      - name: Agent
        url: /v3/api-docs/agent
