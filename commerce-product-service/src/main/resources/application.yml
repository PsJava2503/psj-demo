server:
  port: 8084

spring:
  application:
    name: commerce-product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_product
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

mybatis:
  type-handlers-package: com.commerce.mybatis
