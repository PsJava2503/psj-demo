apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: commerce-user-postgres
spec:
  serviceName: commerce-user-postgres
  replicas: 1
  selector:
    matchLabels:
      app: commerce-user-postgres
  template:
    metadata:
      labels:
        app: commerce-user-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: commerce_user
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: commerce-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-user-postgres
spec:
  selector:
    app: commerce-user-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
