apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-agent-service
  template:
    metadata:
      labels:
        app: commerce-agent-service
    spec:
      containers:
        - name: app
          image: commerce-agent-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8089"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: commerce-config
                  key: NACOS_ADDR
            - name: AGENT_MOCK_ENABLED
              value: "true"
            - name: AGENT_RAG_USE_MILVUS
              value: "false"
            - name: AGENT_UPLOAD_PATH
              value: /tmp/commerce-agent/uploads
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: commerce-secret
                  key: DASHSCOPE_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8089
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
