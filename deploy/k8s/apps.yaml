apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-gateway
  template:
    metadata:
      labels:
        app: commerce-gateway
    spec:
      containers:
        - name: app
          image: commerce-gateway:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: commerce-config
                  key: NACOS_ADDR
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: commerce-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: commerce-config
                  key: REDIS_PORT
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-gateway
spec:
  type: NodePort
  selector:
    app: commerce-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-user-service
  template:
