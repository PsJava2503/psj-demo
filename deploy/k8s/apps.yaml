          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: commerce-config
                  key: NACOS_ADDR
            - name: SPRING_DATASOURCE_URL
