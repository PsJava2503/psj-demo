services:
  app:
    image: eclipse-temurin:17-jre
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ${APP_JAR}:/app/app.jar:ro
      - ./.data/${ENV_NAME}/uploads:/app/uploads
    environment:
      SERVER_PORT: ${APP_PORT}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_ADDR}
      AGENT_UPLOAD_PATH: /app/uploads/agent
      AGENT_MOCK_ENABLED: ${AGENT_MOCK_ENABLED:-true}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-dashscope}
      AGENT_RAG_USE_MILVUS: ${AGENT_RAG_USE_MILVUS:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_COMPLETIONS_PATH: ${OPENAI_COMPLETIONS_PATH:-/v1/chat/completions}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - commerce-net

networks:
  commerce-net:
    external: true
    name: ${NETWORK_NAME}
