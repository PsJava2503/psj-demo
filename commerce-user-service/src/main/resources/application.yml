server:
  port: 8083

spring:
  application:
    name: commerce-user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_user
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
